name: Export Android apksigner

on:
  workflow_dispatch:
  push:
    branches: ["apk-v20-release"]
    paths: [".github/workflows/export-apksigner.yml"]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate apksigner
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          DIR=$(dirname "$APKSIGNER")
          mkdir -p /tmp/apksigner-tool
          cp "$APKSIGNER" /tmp/apksigner-tool/
          cp -r "$DIR/lib" /tmp/apksigner-tool/
          chmod +x /tmp/apksigner-tool/apksigner
          /tmp/apksigner-tool/apksigner version
      - name: Upload apksigner
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: /tmp/apksigner-tool
          if-no-files-found: error
