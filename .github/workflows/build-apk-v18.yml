name: Build APK v19 MODERN

on:
  push:
    branches: ["apk-v19-modern"]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/build-apk-v18.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Dupla-Exclusao-Educacional-v19-MODERN.apk

      - name: Verify APK signature
        run: jarsigner -verify -verbose -certs ../Dupla-Exclusao-Educacional-v19-MODERN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dupla-Exclusao-Educacional-v19-MODERN
          path: Dupla-Exclusao-Educacional-v19-MODERN.apk
          if-no-files-found: error
