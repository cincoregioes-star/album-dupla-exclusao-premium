plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.pedrodequeiroz.duplaexclusao'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.pedrodequeiroz.duplaexclusao.institucional'
        minSdk 23
        targetSdk 35
        versionCode 20
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}
