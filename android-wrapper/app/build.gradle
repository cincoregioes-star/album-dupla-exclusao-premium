plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.pedrodequeiroz.duplaexclusao'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.pedrodequeiroz.duplaexclusao.modern'
        minSdk 23
        targetSdk 35
        versionCode 19
        versionName '1.9'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
